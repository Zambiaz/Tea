<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body login-page coffee-auth-page">

    <div class="page-shell">
        <main class="auth-main">
            <section class="auth-card glass-card coffee-auth-card" aria-labelledby="loginTitle">
                <header class="coffee-auth-header">
                    <h1 id="loginTitle">Welcome Back</h1>
                    <p class="auth-subtitle">Sign in to your account</p>
                </header>
                <nav class="coffee-auth-tabs" aria-label="Account access">
                    <a href="register.html">Register</a>
                    <a class="is-active" href="login.html" aria-current="page">Login</a>
                </nav>

                <form id="loginForm" class="auth-form" novalidate>
                    <div class="form-field">
                        <label for="loginPhoneNumber">Phone Number</label>
                        <div class="input-with-icon phone-input-group">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <path d="M4 5c0-1.1.9-2 2-2h2l2 5-2 1.5c.9 2.3 2.7 4.1 5 5l1.5-2 5 2v2c0 1.1-.9 2-2 2C10.6 20.5 3.5 13.4 4 5Z"></path>
                            </svg>
                            <img id="loginPhoneFlag" class="phone-flag" alt="" hidden>
                            <span id="loginPhoneDialCode" class="phone-dial-code" aria-live="polite"></span>
                            <input type="tel" id="loginPhoneNumber" name="phoneNumber" placeholder="Phone number" autocomplete="tel" inputmode="numeric" required>
                            <div class="phone-country-select-wrap">
                                <select id="loginCountryCode" name="countryCode" aria-label="Country" required>
                                    <option value="">Select</option>
                                </select>
                            </div>
                        </div>
                        <span class="field-error" id="loginPhoneNumberError"></span>
                    </div>

                    <div class="form-field">
                        <label for="loginPassword">Password</label>
                        <div class="input-with-icon">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                            </svg>
                            <input type="password" id="loginPassword" name="password" placeholder="Password" autocomplete="current-password" required>
                            <button type="button" class="toggle-password" id="loginTogglePassword" aria-label="Show password" aria-pressed="false">
                                <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <span class="field-error" id="loginPasswordError"></span>
                    </div>

                    <p class="form-status" id="loginFormStatus" role="status" aria-live="polite"></p>

                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>

                <p class="auth-alt-action">
                    Don’t have an account? <a href="register.html">Register</a>
                </p>
            </section>
        </main>

    </div>

    <script src="api.js"></script>
    <script src="script.js?v=country-phone-v13"></script>
</body>
</html>
