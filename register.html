<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body register-page coffee-auth-page">

    <div class="auth-background" aria-hidden="true">
        <img class="auth-background-slide is-active" src="assets/coffee-slides/coffee-brewing.jpg" alt="" fetchpriority="high">
        <img class="auth-background-slide" src="assets/coffee-slides/coffee-beans.jpg" alt="">
        <img class="auth-background-slide" src="assets/coffee-slides/coffee-cafe.jpg" alt="">
        <img class="auth-background-slide" src="assets/coffee-slides/coffee-selection.jpg" alt="">
        <img class="auth-background-slide" src="assets/coffee-slides/iced-coffee.jpg" alt="">
        <span class="auth-background-overlay"></span>
    </div>
    <div class="page-shell">
        <main class="auth-main">
            <section class="auth-card glass-card coffee-auth-card" aria-labelledby="registerTitle">
                    <header class="coffee-auth-header">
                        <h1 id="registerTitle">Create Account</h1>
                        <p class="auth-subtitle">Create an account to get started</p>
                    </header>
                    <nav class="coffee-auth-tabs" aria-label="Account access">
                        <a class="is-active" href="register.html" aria-current="page">Register</a>
                        <a href="login.html">Login</a>
                    </nav>

                    <form id="registerForm" class="auth-form" novalidate>
                        <div class="form-field">
                            <label for="fullName">Full Name</label>
                            <div class="input-with-icon">
                                <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <circle cx="12" cy="8" r="3.5"></circle>
                                    <path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"></path>
                                </svg>
                                <input type="text" id="fullName" name="fullName" placeholder="e.g. Alex Smith" autocomplete="name" required>
                            </div>
                            <span class="field-error" id="fullNameError"></span>
                        </div>

                        <div class="form-field">
                            <label for="phoneNumber">Phone Number</label>
                            <div class="input-with-icon phone-input-group">
                                <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path d="M4 5c0-1.1.9-2 2-2h2l2 5-2 1.5c.9 2.3 2.7 4.1 5 5l1.5-2 5 2v2c0 1.1-.9 2-2 2C10.6 20.5 3.5 13.4 4 5Z"></path>
                                </svg>
                                <img id="countryFlag" class="phone-flag" alt="" hidden>
                                <span id="phoneDialCode" class="phone-dial-code" aria-live="polite"></span>
                                <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="Select a country first" autocomplete="tel" inputmode="numeric" required>
                                <div class="phone-country-select-wrap">
                                    <select id="countryCode" name="countryCode" aria-label="Country" required>
                                        <option value="">Select</option>
                                    </select>
                                </div>
                            </div>
                            <span class="field-error" id="countryCodeError"></span>
                            <span class="field-error" id="phoneNumberError"></span>
                        </div>

                        <div class="form-field">
                            <label for="password">Password</label>
                            <div class="input-with-icon">
                                <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                </svg>
                                <input type="password" id="password" name="password" placeholder="5-digit password" autocomplete="new-password" inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" required>
                                <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" aria-pressed="false">
                                    <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                            <span class="field-error" id="passwordError"></span>
                        </div>

                        <div class="form-field">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your 5-digit password" autocomplete="new-password" inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" required>
                            <span class="field-error" id="confirmPasswordError"></span>
                        </div>

                        <div class="form-field">
                            <label for="referralCode">Referral Code <span class="optional-tag">(optional)</span></label>
                            <p class="coffee-referral-note" id="referralAttribution" hidden></p>
                            <div class="input-with-icon">
                                <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <circle cx="9" cy="8" r="3"></circle>
                                    <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path>
                                    <circle cx="17" cy="8" r="2.5"></circle>
                                    <path d="M15.5 14.2c2.6.4 4.5 2.7 4.5 5.8"></path>
                                </svg>
                                <input type="text" id="referralCode" name="referralCode" placeholder="Enter a referral code">
                            </div>
                            <span class="field-error" id="referralCodeError"></span>
                        </div>

                        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>

                        <button type="submit" class="btn btn-primary btn-block">Register</button>
                    </form>

                    <p class="auth-alt-action">
                        Already have an account? <a href="login.html">Login</a>
                    </p>
            </section>
        </main>

    </div>

    <script src="auth-background.js"></script>
    <script src="api.js"></script>
    <script src="script.js?v=country-phone-v13"></script>
</body>
</html>
